name: Build HsMod

on:
  push:
    branches: [ "bepinex5" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest   # ✅ 必须是 Windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.3

      - name: Restore NuGet
        run: nuget restore HsMod.sln

      - name: Build with MSBuild
        run: |
          msbuild HsMod.sln ^
            /p:Configuration=Release ^
            /p:Platform="Any CPU"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HsMod-build
          path: |
            **/HsMod.dll
