name: Build HsMod

on:
  push:
    branches: [ "bepinex5" ]
  pull_request:
    branches: [ "bepinex5" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET Framework
        uses: microsoft/setup-msbuild@v1.3

      - name: Restore NuGet packages
        run: nuget restore HsMod.sln

      - name: Build HsMod
        run: msbuild HsMod.sln /p:Configuration=Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HsMod-build
          path: |
            **/bin/Release/*.dll
