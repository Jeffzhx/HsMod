name: Sync with Upstream

on:
  schedule:
    - cron: '0 0 * * *'  # 每天凌晨
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Upstream
        uses: aormsby/fork-sync-with-upstream-action@v3.4
        with:
          upstream_sync_repo: Pik-4/HsMod
          upstream_sync_branch: bepinex5
          target_sync_branch: bepinex5
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          test_mode: false
