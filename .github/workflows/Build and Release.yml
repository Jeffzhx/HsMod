name: Build and Release HsMod

on:
  push:
    branches: [ bepinex5 ]
  workflow_dispatch:  # Allows manual trigger

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Setup NuGet
        uses: nuget/setup-nuget@v2
      - name: Restore Packages
        run: nuget restore HsMod.sln
      - name: Build Solution
        run: msbuild HsMod.sln /p:Configuration=Release /p:Platform="Any CPU"
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest Build
          body: Automated build of HsMod.dll from commit ${{ github.sha }}
          prerelease: true
          files: HsMod/Release/HsMod.dll
